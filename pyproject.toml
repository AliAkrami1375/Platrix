[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platrix"
version = "1.0.0"
description = "Real-time, self-hosted Iranian license plate recognition (ALPR) engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["alpr", "anpr", "license-plate", "iran", "opencv", "computer-vision", "ocr"]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "onnxruntime>=1.17",
    "Pillow>=10.0",
]

[project.optional-dependencies]
train = ["torch>=2.2"]                            # train the OCR CNN -> ONNX
yolo = ["torch>=2.2", "torchvision>=0.17", "ultralytics>=8.1"]  # YOLO detector
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
platrix = "platrix.cli:main"

[project.urls]
Repository = "https://github.com/AliAkrami1375/Platrix"

[tool.setuptools.packages.find]
include = ["platrix*"]

[tool.setuptools.package-data]
platrix = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
